name: Supabase Keep-Alive

# Supabase's free tier automatically pauses a project after 7 days with
# zero database activity. This runs a harmless read every 3 days,
# permanently, with no one needing to remember to do it manually.

on:
  schedule:
    - cron: '0 6 */3 * *'  # every 3 days at 6am UTC
  workflow_dispatch: {}     # lets you trigger it manually from GitHub too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep the project active
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/platform_settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
